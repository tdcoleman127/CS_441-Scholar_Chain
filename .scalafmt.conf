# ScholarChain formatter configuration. Owner: build-engineer.
# The version must equal Versions.scalafmt in project/Versions.scala (checked at sbt load time).
version = 3.11.5

runner.dialect = scala3
maxColumn = 100
lineEndings = unix

align.preset = more
docstrings.style = Asterisk
trailingCommas = never
newlines.source = keep

rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle
rewrite.redundantBraces.stringInterpolation = true

# Build definitions are compiled by sbt 1.x with Scala 2.12, not Scala 3.
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/**/*.scala" {
    runner.dialect = scala212source3
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala212source3
  }
}
