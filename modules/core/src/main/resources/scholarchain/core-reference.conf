# ScholarChain configuration reference defaults. Owner: domain-engineer.
#
# Lowest-precedence layer (see ConfigLoader): environment variables override the versioned
# configuration file, which overrides this file.
#
# Every value here is a PLACEHOLDER or an obviously non-production value:
# - strings start with "placeholder-";
# - the AWS account ID is the all-zero ID 000000000000;
# - the profile is "local-placeholder".
# ScholarChainConfig.placeholderProblems lists any of these that survive into a loaded
# configuration, and a deployed component must refuse to start while that list is non-empty.
#
# Algorithm parameters (entity-resolution thresholds, the graph window, bridge-algorithm
# parameters) deliberately have NO defaults. They must come from the versioned configuration
# file or the environment; loading fails closed when they are absent.
#
# This file is not named reference.conf, so it is never merged implicitly by Typesafe Config.

scholarchain {
  config-schema-version = 1
  profile = "local-placeholder"

  aws {
    region = "placeholder-region"
    account-id = "000000000000"
  }

  storage {
    raw-bucket = "placeholder-raw-bucket"
    curated-bucket = "placeholder-curated-bucket"
    vector-bucket = "placeholder-vector-bucket"
    vector-index = "placeholder-vector-index"
    dynamodb-table-prefix = "placeholder-table-prefix"
    neptune-endpoint = "placeholder-neptune-endpoint"
    run-manifest-prefix = "placeholder-run-manifest-prefix"
  }

  models {
    embedding-model-id = "placeholder-embedding-model"
    generation-model-id = "placeholder-generation-model"
  }
}
