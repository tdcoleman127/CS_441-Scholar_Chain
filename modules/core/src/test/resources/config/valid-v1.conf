# Test-only configuration (config schema version 1). Every value is a fictional test value.
scholarchain {
  config-schema-version = 1
  profile = "unit-test"

  aws {
    region = "test-region-1"
    account-id = "111111111111"
  }

  storage {
    raw-bucket = "file-raw-bucket"
    curated-bucket = "file-curated-bucket"
    vector-bucket = "file-vector-bucket"
    vector-index = "file-vector-index"
    dynamodb-table-prefix = "file-table-prefix"
    neptune-endpoint = "file-neptune-endpoint.test"
    # run-manifest-prefix is deliberately absent: it falls back to the reference placeholder.
  }

  models {
    embedding-model-id = "test-embedding-model"
    generation-model-id = "test-generation-model"
  }

  entity-resolution {
    policy-version = "er-policy-test"
    auto-match-threshold = 0.9
    review-threshold = 0.6
  }

  graph {
    window-start-year = 2015
    window-end-year = 2024
    policy-version = "graph-policy-test"
  }

  bridges {
    algorithm = "test-bridge-algorithm"
    max-iterations = 10
    min-edge-weight = 1.0
  }
}
