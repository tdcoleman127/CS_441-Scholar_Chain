# ScholarChain entity-resolution scoring policy. Owner: entity-resolution-engineer.
# Every threshold the resolver uses comes from this file (or an override of it), never from code.
# A change to any value below is a policy change: bump policy-version and rerun the gold-set
# evaluation. A change that moves accepted merges by more than the evaluation error margin needs
# human approval with the confusion-matrix delta.
#
# Status: UNCALIBRATED. The only human-labeled set is the 48-pair gold pilot
# (gold/v1/labeling-worksheet-v1.csv), which is too small to tune on. The values are engineering
# priors chosen to be conservative. No value below was fitted to the pilot.
#
# Changelog (the file was er-policy-v1.conf through er-policy-v2; renamed with v3, closing R-05-6):
#   er-policy-v1 (WO-05, 2026-11-01): first version.
#   er-policy-v2 (Phase 05 repair-01, 2026-11-02): rule changes only, in code, not in values.
#     F1: identifiers agree or conflict only within the pair's scope. A mention pair uses only
#         ORCID and OpenAlex author (A) IDs; DOI, arXiv, s2, and OpenAlex work IDs are ignored. A
#         same-work mention pair whose researcher IDs agree is a conflict output.
#     F2: the deterministic mention accept also needs initialsCompatibility == 1, so pairs without
#         computable initials (Hadoop raw-feature proxies, mononyms) take the probabilistic path.
#   er-policy-v3 (Phase 11 repair-01, 2026-11-14; human decision STRICT, 2026-11-14):
#     D3: missing evidence never raises a score. The probabilistic score is no longer renormalized
#         over the computable features. It is a pair of bounds over ALL weighted features of the
#         scope: `lower` counts a missing feature as 0, `upper` counts it as 1. Accept needs
#         lower >= accept; reject needs upper < reject. The reported score is `lower`.
#     D3-floor: name plus initials alone can never reach accepted. A probabilistic or adjudicated
#         accept needs corroboration (below): positive evidence from a feature that does not come
#         from the name. Uncorroborated pairs are unresolved and are not sent to the adjudicator.
#         min-evidence-weight now counts only the name-independent features.
#     M1: features er-features-v3 (coauthorOverlap of two empty coauthor sets is 0.0 on every
#         path, as in the Hadoop raw feature contextJaccard). Thresholds and weights unchanged.
#   er-policy-v4 (Phase 11 repair-02, 2026-11-15; human decisions STRICT 2026-11-14 and RR3
#   2026-11-15): rule changes only, in code. No value below changed. No missing value moves a
#   decision to accepted.
#     RR3: the deterministic mention accept needs an OBSERVED year gap <= mention-max-year-gap. A
#         missing year falls through to the scored path, where it needs corroboration.
#     Accept blocks: a value whose observed form vetoes the pair blocks every non-ID accept when it
#         is missing (reason code accept-blocked:<why>; unresolved; never adjudicated):
#         same-work-unknown (when reject-same-work is on) and initials-unknown (when
#         reject-incompatible-initials is on), mention scope only. An ID-agreeing mention pair whose
#         same-work flag is unknown is unresolved, not accepted. On the Hadoop raw-feature path
#         initials are never computable, so it accepts only on ORCID agreement (G1, P11-F3).
#     Adjudicator band: only pairs with lower >= reject (corroborated, not blocked) are sent to the
#         adjudicator. A pair with lower < reject <= upper is unresolved (bounds-straddle-reject):
#         only its missing features keep it out of the reject band.
#     Sweep: a review item without `corroborated` (pre-v3) or with accept-blocked never re-bands
#         to accepted.
#     RR4: features er-features-v4 (coauthor identity keeps the DBLP homonym number, as the Hadoop
#         context does: "Wei Wang 0001" and "Wei Wang 0002" are different coauthors).
#   er-policy-v5 (Phase 11 repair-03, 2026-11-15; review-02 F3; human decision STRICT): rule and
#   validation changes only. No value below changed; at these values no decision changes.
#     F3: the deterministic mention accept (name-exact+coauthor-overlap) and the deterministic work
#         accept (title-exact+year) also need corroboration (below), like the scored accepts.
#     F3 validation (ScoringPolicy.validated; an invalid policy fails to load):
#         mention-coauthor-min in (0, 1] and >= corroboration.coauthor-overlap-min;
#         work-title-min in (0, 1] and >= corroboration.title-similarity-min;
#         mention-name-min in (0, 1]; both maximum year gaps >= 0; accept > 0; every weight >= 0;
#         every number finite; sweep values in [0, 1].
#         Before v5, mention-coauthor-min = 0 accepted two single-author "J. Smith" mentions
#         (empty coauthors observe 0.0 since M1) on name, initials, and year alone.
#     File renamed from er-policy-v4.conf (git mv; the last committed name is er-policy-v1.conf).

scholarchain.entity-resolution.policy {
  policy-version = "er-policy-v5"

  # Probabilistic path, on the score bounds (lower, upper):
  #   lower >= accept and corroborated -> accepted;
  #   upper < reject                   -> rejected;
  #   otherwise                        -> unresolved (adjudicator band only when corroborated, not
  #                                       accept-blocked, and lower >= reject; v4).
  thresholds {
    accept = 0.85
    reject = 0.55
  }

  # Below this total weight of COMPUTABLE NAME-INDEPENDENT features (coauthor-overlap,
  # title-similarity, year-distance) the pair is unresolved (insufficient evidence). The name
  # features never count: name agreement is what put the pair in a block in the first place.
  # 0.15 = year or coauthors must be observed; a title alone (0.05 for mentions) is not enough.
  min-evidence-weight = 0.15

  # Corroboration: a probabilistic or adjudicated accept needs at least one of these
  # name-independent features at or above its minimum (inclusive). Both minimums must be > 0, so a
  # zero overlap never corroborates. year-distance never corroborates (many homonyms publish in
  # the same year). Priors: any shared coauthor in lists of up to about 20 names; half the title
  # tokens shared.
  corroboration {
    coauthor-overlap-min = 0.05
    title-similarity-min = 0.5
  }

  # yearDistance d maps to the score component max(0, 1 - d / year-scale).
  year-scale = 20

  # Feature weights of the bounded weighted mean (divided by the sum of the scope's positive
  # weights, whether or not each feature is computable). idAgreement is not weighted: agreement
  # takes the exact-ID path and conflict the conflict path.
  weights {
    mention {
      name-similarity = 0.40
      initials-compatibility = 0.15
      coauthor-overlap = 0.25
      title-similarity = 0.05
      year-distance = 0.15
    }
    work {
      name-similarity = 0.0
      initials-compatibility = 0.0
      coauthor-overlap = 0.25
      title-similarity = 0.60
      year-distance = 0.15
    }
  }

  # Deterministic bibliographic rules (applied before the probabilistic score). Every accept
  # condition needs an observed value (v4). The two reject rules fire only on observed values; when
  # their value is missing, the pair cannot be accepted except by an exact ID (v4 accept blocks).
  # Both accepts also need corroboration (v5). The minimums must be in (0, 1] and at or above the
  # matching corroboration minimum (v5); the maximum year gaps must be >= 0.
  deterministic {
    reject-same-work = true             # two different author positions on one work
    reject-incompatible-initials = true # initialsCompatibility == 0
    mention-name-min = 1.0              # accept: nameSimilarity >= this, initials compatible (== 1)
    mention-coauthor-min = 0.5          #   and coauthorOverlap >= this (>= coauthor-overlap-min)
    mention-max-year-gap = 15           #   and yearDistance <= this (present; v4: absent blocks)
    work-title-min = 1.0                # accept: titleSimilarity >= this (>= title-similarity-min)
    work-max-year-gap = 1               #   and yearDistance <= this (present)
  }

  # Threshold sensitivity sweep used by the evaluator (probabilistic path only).
  sweep {
    accept = [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    reject = [0.30, 0.40, 0.50, 0.55, 0.60, 0.70]
  }
}
