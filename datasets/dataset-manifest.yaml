      version: "OAI-PMH harvest, live; pinned per harvest by from/until window and responseDate"
      date: "2026-10-18 (verification date; each harvest records its own responseDate)"
      evidence_url: "https://oaipmh.arxiv.org/oai?verb=Identify"
    format: "OAI-PMH 2.0 XML (ListRecords pages with resumptionToken), metadataPrefix=arXiv, UTF-8"
    size_estimate:
      text: "unknown: arXiv does not state a metadata harvest size on the verified pages. Bounded runs fetch at most 5 ListRecords pages per call."
      evidence_url: "https://info.arxiv.org/help/oa/index.html"
    s3_prefixes:
      subset: "s3://${raw_bucket}/raw/arxiv/oai/set=cs/harvest=${harvest_date}/"
      sample: "s3://${sample_bucket}/samples/arxiv/manifest_version=1/"
    checksums:
      upstream:
        - file: "ListRecords pages"
          algorithm: none
          value: "to be recorded at download"
          evidence_url: "https://info.arxiv.org/help/oa/index.html"
          note: "OAI-PMH provides no checksums. fetch-by-id.sh writes a sha256 sidecar per page."
      samples:
        - path: "datasets/samples/arxiv/arxiv-oai-sample.xml"
          sha256: "392f94c165c4c5744f3a1bd090319ecb3d1001e31743019dbb9ebb2c54970851"
          bytes: 2648
    subset_rule: >-
      Set cs, datestamp window from configuration, at most 5 pages per call, 3 s minimum between
      requests (fetch-by-id.sh arxiv). Keep only records whose id matches a DBLP CoRR ee URL or
      whose doi matches a DBLP seed DOI. A full harvest needs human approval because the size is
      unknown.
    schema: "datasets/schemas/arxiv.md"
    linkage_keys:
      - key: arxiv_id
        namespace: arxiv
        field: "metadata/arXiv/id"
      - key: doi
        namespace: doi
        field: "metadata/arXiv/doi (lowercase)"
    update_method: "Incremental OAI-PMH harvest: from = last responseDate, no until. Each harvest gets its own harvest= prefix. Deleted records arrive as header status=deleted."
    limitations:
      - "Harvest size is unknown. No checksums."
      - "The OAI identifier prefix (oai:arXiv.org:) and TeX escapes in names are unverified."
      - "The 3 s rate limit makes large harvests slow: one page per request."
    privacy_notes:
      - "Contains real author names and optional free-text affiliations supplied by submitters."
      - "Affiliations, institution-level only at runtime (HD-03-02, human decision, phase 03 human gate, 2026-10-18): authors/author/affiliation strings may be used in batch only, for example as entity-resolution features, and are dropped before Neptune, DynamoDB, S3 Vectors, and any runtime-facing export. arXiv carries no resolved institution IDs, so no arXiv affiliation data reaches runtime."
      - "Abstracts are CC0 metadata, but they are authored text. Use them only as provenance-tagged evidence text."
      - "The sample is fictional."
    decision_refs: [HD-03-02, HD-03-04]
    affiliation_handling:
      decision: HD-03-02
      batch_only_fields:
        - "metadata/arXiv/authors/author/affiliation"
      runtime_allowed_fields: []
      runtime_allowed_note: "arXiv has no resolved institution IDs."
      drop_before: [neptune, dynamodb, s3-vectors, runtime-export]
    confirmation_download:
      decision: HD-03-04
      status: approved-in-principle-not-run
      bound: "One ListRecords page (set cs, a one-day datestamp window) through fetch-by-id.sh arxiv --max-pages 1, 3 s minimum between requests."
      confirms:
        - "OAI identifier prefix oai:arXiv.org:"
        - "TeX accent escapes in author names"
    validation_commands:
      - "bash datasets/scripts/validate-datasets.sh"
      - "bash datasets/scripts/fetch.sh arxiv --plan"
      - "bash datasets/scripts/fetch-by-id.sh arxiv --from 2024-01-01 --until 2024-01-01 --dest \"$SCHOLARCHAIN_DATA_DIR\" --plan"
    samples:
      - path: "datasets/samples/arxiv/arxiv-oai-sample.xml"
        format: xml
        well_formed: true
        record_element: "record"
        records: 3
        malformed_records: 0
        provenance: "Synthetic, hand-authored by dataset-engineer on 2026-10-18 as an OAI-PMH ListRecords response in the arXiv metadata format."
        license: "CC0-1.0 (ScholarChain-authored)"
        edge_cases:
          - "TeX-escaped author name M\\\"uller"
          - "multi-line title"
          - "old-style identifier with suffix, no DOI, no license"
          - "deleted record (header only)"
          - "preprint of the DBLP conference work (shared DOI 10.5555/sc441.0001)"

excluded_candidates:
  - id: orcid
    source_type: orcid
    reason: >-
      Excluded as a bulk dataset in phase 03. The annual Public Data File (2025 is the latest
      listed) is CC0, and its use policy imposes no access conditions. But it is a registry of
      personal profiles, and the use policy asks users to 'Respect the rights of privacy and
      publicity of the individuals' and notes that the data elements 'remain subject to any
      rights of the individuals'. Its size was not stated on the verified page. ORCID iDs already
      reach ScholarChain as linkage keys through DBLP (author/@orcid), Crossref (author.ORCID,
      authenticated-orcid), and OpenAlex.
      Human decision, phase 03 human gate, 2026-10-18 (HD-03-01): EXCLUDED. ORCID iDs are used
      only when DBLP, OpenAlex, or Crossref already carry them. No bulk personal-profile data is
      ingested.
    decision_refs: [HD-03-01]
    evidence_urls:
      - "https://info.orcid.org/documentation/integration-guide/working-with-bulk-data/"
      - "https://info.orcid.org/public-data-file-use-policy/"
      - "https://pub.orcid.org/v3.0/0000-0002-1825-0097/person"
  - id: semantic-scholar
    source_type: semantic-scholar
    reason: >-
      Excluded. The API License Agreement grants 'a limited, non-exclusive, non-transferable,
      non-sublicensable and terminable license', forbids redistributing or sublicensing, and
      requires attribution and citation. Bulk S2 datasets (S2AG, S2ORC) are 'separately governed
      by the licenses that accompany such S2 Data', which the page's examples show can include
      CC BY-NC. Those licenses were not verified per dataset. An API key would be a credential
      outside Secrets Manager. The terms need human review before any use.
      Human decision, phase 03 human gate, 2026-10-18 (HD-03-05): stays excluded. The legal
      review question is deferred (Q-semantic-scholar-license-review).
    decision_refs: [HD-03-05]
    evidence_urls:
      - "https://www.semanticscholar.org/product/api/license"
  - id: papers-with-code
    source_type: papers-with-code
    reason: >-
      Excluded. On 2026-10-18 https://paperswithcode.com/about returned HTTP 302 to
      https://huggingface.co/papers/trending, so no current official data dump or license page
      could be verified. Linkage value for coauthorship is also low (paper-to-code links).
    evidence_urls:
      - "https://paperswithcode.com/about"

open_questions:
  - id: Q-openalex-snapshot-pin
    status: open
    owner: dataset-engineer
    question: "OpenAlex snapshot pin: the documentation describes a September 2026 release, but quarterly releases fall on the second Wednesday of January, April, July, and October. Which release is current must be read from the bucket's release notes at download."
    note: "Kept open by HD-03-05."
  - id: Q-openalex-api-key
    status: open
    owner: dataset-engineer
    question: "OpenAlex API: are keyless requests still served, and how is a key passed? If a key is needed it has to come from Secrets Manager (infra-engineer and human). The HD-03-04 confirmation download will show whether keyless requests work."
  - id: Q-opencitations-snapshot-date
    status: open
    owner: dataset-engineer
    question: "OpenCitations: 'Released on 2026-07-28' (download page) versus Figshare v8 of 2026-09-08. Which is the citable snapshot?"
    note: "Kept open by HD-03-05. The manifest pins Figshare v8."
  - id: Q-dblp-size
    status: open
    owner: dataset-engineer
    question: "DBLP uncompressed size and record count are not stated by the publisher."
    note: "Kept open by HD-03-05."
  - id: Q-dblp-confirmation-bound
    status: closed
    resolution: HD-03-06
    question: "HD-03-04 approves 'a few hundred records or one shard' per source, but dblp's smallest verified official artifact is the 1.03 GB release file. What byte bound does the human approve for the dblp confirmation download?"
    note: >-
      Closed by HD-03-06 (phase 03 human gate, Round 2: "DBLP test download limit can be
      increased for now"). dataset-engineer set the bound to 1200000000 bytes (dblp
      confirmation_download.max_bytes, justified there). It stays human-invoked only, because
      fetch.sh --full is blocked for every agent (docs/agents.md section 7b). The human passes the
      bound as --max-bytes. The bound is provisional ("for now").
  - id: Q-crossref-public-data-file
    status: closed
    resolution: HD-03-03
    question: "Crossref public data file: is a requester-pays S3 transfer or a torrent download acceptable?"
    note: "Closed: no bulk data file; bounded REST API by DOI only."
  - id: Q-orcid-public-data-file
    status: closed
    resolution: HD-03-01
    question: "Is ORCID public-data-file ingestion wanted at all?"
    note: "Closed: excluded. ORCID iDs are used only as carried by DBLP, OpenAlex, or Crossref."
  - id: Q-affiliations-runtime
    status: closed
    resolution: HD-03-02
    question: "May affiliation data reach runtime stores?"
    note: "Closed: institution-level only (ROR or OpenAlex institution IDs with a year). Raw affiliation strings are batch only."
  - id: Q-semantic-scholar-license-review
    status: deferred
    resolution: HD-03-05
    question: "Semantic Scholar: should its license terms be reviewed for a later phase?"
    note: "Deferred. Semantic Scholar stays excluded."
  - id: Q-line-endings
    status: closed
    resolution: owner-fix
    resolved_by: build-engineer
    question: "Line endings: a .gitattributes rule (for example 'datasets/samples/** -text') is needed so checkouts keep sample bytes exact. build-engineer owns .gitattributes; another agent is working on it in this phase."
    note: >-
      Closed. build-engineer added 'datasets/samples/** -text -eol' as the last path rule in
      .gitattributes (last match wins), plus '*.py', '*.tsv', and '*.md' as 'text eol=lf'.
      dataset-engineer verified it in phase 03 Round 2 (evidence below). Residual: .gitattributes
      was still uncommitted on 2026-10-18 (git status ' M .gitattributes'). The rule protects
      fresh checkouts only once it is committed with or before the samples (human commit). The
      local core.autocrlf was 'input' when checked.
    evidence:
      - command: "git check-attr -a datasets/samples/dblp/dblp-sample.xml datasets/samples/opencitations/opencitations-index-sample.csv datasets/samples/SHA256SUMS"
        observed: "text: unset and eol: unset for all three paths"
        observed_on: "2026-10-18"
      - command: "git check-attr -a datasets/scripts/validate_datasets.py datasets/scripts/sources.tsv"
        observed: "text: set and eol: lf for both paths"
        observed_on: "2026-10-18"
      - command: "bash datasets/scripts/record-sample-checksums.sh --check"
        observed: "STEP sample-checksums action=check result=ok files=7 (exit 0)"
        observed_on: "2026-10-18"
  - id: Q-unverified-wire-details
    status: open
    owner: dataset-engineer
    question: "Unverified wire details listed in each schema note (OpenAlex authorship and institution subfields, Crossref ORCID scheme, OpenCitations bulk CSV column order, the arXiv OAI identifier prefix, the DBLP CoRR key pattern) must be confirmed before parsers depend on them."
    note: "HD-03-04 approves one bounded confirmation download per source in principle. Not yet run; each dataset's confirmation_download block records the bound."
  - id: Q-linkage-keys-without-core-namespace
    status: closed
    resolution: owner-fix
    resolved_by: domain-engineer
    question: "Linkage keys with no usable core IdNamespace: dblp_person_id (dblp), oci (opencitations), and openalex_author_id (the openalex namespace exists, but core's researcher ID kind takes no namespace). Should core add namespaces or keep these as source record IDs only?"
    note: >-
      Closed. dataset-engineer verified domain-engineer's phase 03 settlement in the
      modules/core working tree, which the human has not yet committed. (1) omid and pmid are
      IdNamespace values, and IdKind.Work allows them. (2) oci deliberately has no namespace:
      IdFormat.normalizeOci pins it as the sourceRecordId of a CITES edge's evidence. (3) The
      Researcher ID kind takes no namespace. A dblp person ID or an OpenAlex author ID becomes a
      researcher ID only as the anchor of researcher:sc1:H("scholarchain:researcher:sc1",
      anchorDataset, anchorRecordId) through StableIds.scholarChainResearcherId. Otherwise it is
      a source record ID. Core contains no dblp-person-specific or OpenAlex-author-specific code.
      Which anchor a cluster uses is entity-resolution policy. The manifest's linkage_keys keep
      namespace none (with notes) for dblp_person_id and oci, and openalex for
      openalex_author_id.
    evidence:
      - command: "grep -n -A18 'enum IdNamespace' modules/core/src/main/scala/edu/uic/cs441/scholarchain/core/model/Enums.scala"
        observed: "case Omid extends IdNamespace(\"omid\") and case Pmid extends IdNamespace(\"pmid\") are present. No oci, dblp-person, or openalex-author namespace."
        observed_on: "2026-10-18"
      - command: "sed -n 15,60p modules/core/src/main/scala/edu/uic/cs441/scholarchain/core/ids/IdFormat.scala"
        observed: "IdKind.Work namespaces include IdNamespace.Omid and IdNamespace.Pmid. IdKind.Researcher is declared with Set.empty."
        observed_on: "2026-10-18"
      - command: "sed -n 205,225p modules/core/src/main/scala/edu/uic/cs441/scholarchain/core/ids/IdFormat.scala"
        observed: "normalizeOci strips 'oci:' and requires <digits>-<digits>. Its Scaladoc: an OCI 'is a provenance record key rather than an IdNamespace' and 'the OCI is the sourceRecordId of that edge's evidence'."
        observed_on: "2026-10-18"
      - command: "sed -n 95,130p modules/core/src/main/scala/edu/uic/cs441/scholarchain/core/ids/StableIds.scala"
        observed: "scholarChainResearcherId(identityVersion, anchorDataset: SourceType, anchorRecordId) returns researcher:sc<N>:H(\"scholarchain:researcher:sc<N>\", anchorDataset.wire, anchorRecordId). The Scaladoc says the anchor choice belongs to entity-resolution."
        observed_on: "2026-10-18"
