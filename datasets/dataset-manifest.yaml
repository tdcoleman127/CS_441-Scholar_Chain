# ScholarChain dataset manifest. Owner: dataset-engineer. Gate: manifest validation.
# Validate with: bash datasets/scripts/validate-datasets.sh
#
# Conventions
# - Facts are cited with the official URL they were read from and the date they were read
#   (source.evidence, license.evidence_url, snapshot.evidence_url, size_estimate.evidence_url).
#   Anything that could not be verified says "unknown" or "unverified" and is listed in
#   open_questions.
# - S3 prefixes are templates. ${raw_bucket} and ${sample_bucket} are resolved from configuration
#   (domain-engineer's configuration loader). No bucket name appears here.
# - Upstream checksums are the publisher's own digest when one exists, otherwise
#   "to be recorded at download" (fetch.sh writes a sha256 sidecar on first download).
# - Sample checksums are sha256 over raw bytes and must match datasets/samples/SHA256SUMS.
# - source_type values are the wire names of SourceType in modules/core.
# - linkage_keys[].namespace is the exact IdNamespace wire name in modules/core, or "none" with a
#   namespace_note when core has no namespace for that key.
# - human_decisions are recorded verbatim in meaning, each with recorded_as
#   "human decision, phase 03 human gate, 2026-10-18". Datasets cite them in decision_refs.
#   open_questions carry a status (open | closed | deferred); a closed or deferred question names
#   the decision that settled it, or (closed only) resolution owner-fix with resolved_by and the
#   dated command evidence dataset-engineer observed.
# - A dataset with a full-tier row in datasets/scripts/sources.tsv records, in
#   confirmation_download, the byte bound (max_bytes) the human passes to fetch.sh --full, the
#   human decision that approved it (approved_by), and invoked_by: human. fetch.sh --full is
#   human-invoked only: docs/agents.md section 7b blocks it for every agent.
manifest_version: 1
owner: dataset-engineer
phase: "03"
verified_on: "2026-10-18"
s3_prefix_placeholders:
  raw_bucket: "Raw upstream snapshots, read by the Hadoop ingestion jobs. Name comes from configuration."
  sample_bucket: "Committed samples mirrored for EMR smoke runs. Name comes from configuration."
sample_policy:
  max_bytes_per_file: 65536
  content: >-
    Committed samples are synthetic records authored for ScholarChain and dedicated to the public
    domain (CC0-1.0), written in each source's exact wire format. Exception: dblp.dtd, a verbatim
    upstream file released under CC0 1.0 by dblp. All people, works, and identifiers are
    fictional, except Josiah Carberry, the documented fictitious demonstration person of ORCID and
    Crossref (ORCID 0000-0002-1825-0097). DOIs use the Crossref test-account prefix 10.5555.
    Synthetic OpenAlex, OMID, PMID, and arXiv identifiers may coincide with real identifiers in
    those namespaces. Never dereference them, and never load sample records into production
    stores.
  shared_cross_source_records:
    - doi: "10.5555/sc441.0001"
      appears_in: ["dblp (ee, two records)", "crossref", "openalex (uppercase)", "opencitations", "arxiv (2401.99901)"]
    - doi: "10.5555/sc441.0002"
      appears_in: ["dblp", "crossref (uppercase)", "openalex", "opencitations"]
    - doi: "10.5555/sc441.0003"
      appears_in: ["dblp (24 authors)", "crossref (24 authors)", "opencitations"]

# Decisions the human architect made on 2026-10-18 in the orchestrator session, relayed to
# dataset-engineer in the phase 03 repair work order. They are to be written into
# docs/agent-runs/phase-03/human-gate.md by the human (that file is human-only).
human_decisions:
  - id: HD-03-01
    date: "2026-10-18"
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    topic: "ORCID Public Data File"
    decision: excluded
    text: >-
      The ORCID Public Data File is excluded. ORCID iDs are used only when DBLP, OpenAlex, or
      Crossref already carry them. No bulk personal-profile data is ingested.
    applies_to: [orcid, dblp, openalex, crossref]
    closes: [Q-orcid-public-data-file]
  - id: HD-03-02
    date: "2026-10-18"
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    topic: "Affiliations"
    decision: institution-level-only-at-runtime
    text: >-
      Only resolved institution links (ROR or OpenAlex institution IDs) with a year may reach
      runtime stores. Raw affiliation strings (OpenAlex raw_affiliation_strings, Crossref
      affiliation names, DBLP note type="affiliation", and arXiv author affiliation) may be used
      in batch only, for example as entity-resolution features. They must be dropped before
      Neptune, DynamoDB, S3 Vectors, and any runtime-facing export.
    applies_to: [dblp, openalex, crossref, arxiv]
    closes: [Q-affiliations-runtime]
  - id: HD-03-03
    date: "2026-10-18"
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    topic: "Crossref access path"
    decision: rest-api-by-doi-only
    text: >-
      No Crossref requester-pays (or torrent) bulk public data file. Crossref is accessed only
      through the bounded REST API, one DOI at a time.
    applies_to: [crossref]
    closes: [Q-crossref-public-data-file]
  - id: HD-03-04
    date: "2026-10-18"
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    topic: "Confirmation downloads"
    decision: approved-in-principle-not-run
    text: >-
      Approved in principle for a later phase: one small bounded fetch per selected source (a few
      hundred records or one shard) to confirm the fields marked unverified. Approved but not yet
      run. No download is run in phase 03.
    applies_to: [dblp, openalex, crossref, opencitations, arxiv]
    closes: []
  - id: HD-03-05
    date: "2026-10-18"
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    topic: "Semantic Scholar and remaining open items"
    decision: semantic-scholar-stays-excluded
    text: >-
      Semantic Scholar stays excluded. Its legal review question stays open as deferred. The
      OpenAlex snapshot pin, the OpenCitations snapshot date, and DBLP's size stay open.
    applies_to: [semantic-scholar, dblp, openalex, opencitations]
    closes: []
    defers: [Q-semantic-scholar-license-review]
  - id: HD-03-06
    date: "2026-10-18"
    date_note: "Round 2 of docs/agent-runs/phase-03/human-gate.md states no date. 2026-10-18 is the date of the phase 03 Round 2 work order that relayed it to dataset-engineer."
    recorded_as: "human decision, phase 03 human gate, 2026-10-18"
    source: "docs/agent-runs/phase-03/human-gate.md, Round 2, Ratification"
    topic: "DBLP confirmation-download limit"
    decision: dblp-confirmation-bound-raised
    quote: "DBLP test download limit can be increased for now"
    text: >-
      The human allows the dblp confirmation-download limit to go above HD-03-04's "a few
      hundred records or one shard", for now. dataset-engineer set the bound to 1200000000 bytes
      (dblp confirmation_download.max_bytes), which covers the single 1.03 GB release file. The
      download stays human-invoked only: the same Round 2 ratification blocks full downloads for
      every agent (quote: "full downloads are blocked for all agents"; docs/agents.md section 7b).
      "For now" makes the bound provisional. A later human gate may lower or withdraw it.
    applies_to: [dblp]
    closes: [Q-dblp-confirmation-bound]

datasets:
