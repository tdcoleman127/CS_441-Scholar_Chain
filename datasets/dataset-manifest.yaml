        public_data_file_excluded: "Not used (HD-03-03). Listed for the record only: Academic Torrents, or requester-pays S3 bucket api-snapshots-reqpays-crossref (example file March-2025-public-data-file-from-crossref.tar)"
      evidence:
        - url: "https://www.crossref.org/documentation/retrieve-metadata/"
          retrieved: "2026-10-18"
          fact: "Metadata reusable without restriction except abstracts. Bibliographic metadata including references is facts. Crossref-generated data is CC0. Abstracts are publisher or author copyright."
        - url: "https://www.crossref.org/documentation/retrieve-metadata/bulk-downloads/"
          retrieved: "2026-10-18"
          fact: "The 2025 public data file is approximately 200 GB, a tar with JSONL. Academic Torrents and requester-pays bucket api-snapshots-reqpays-crossref. No checksums on the page."
        - url: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/"
          retrieved: "2026-10-18"
          fact: "Polite pool through the mailto parameter. 'almost none of the metadata is subject to copyright'. Some abstracts may be copyrighted."
        - url: "https://github.com/CrossRef/rest-api-doc/blob/master/api_format.md"
          retrieved: "2026-10-18"
          fact: "Work fields DOI, title, author (Contributor: family, given, ORCID, authenticated-orcid, affiliation), issued, container-title, type, reference."
        - url: "https://api.crossref.org/works/10.5555/12345678"
          retrieved: "2026-10-18"
          fact: "Prefix 10.5555 belongs to publisher 'Test accounts' (member 7822). The author object carries sequence."
    license:
      name: "Facts, no known copyright (bibliographic metadata); CC0-1.0 for Crossref-generated data; abstracts excluded"
      url: "https://www.crossref.org/documentation/retrieve-metadata/"
      evidence_url: "https://www.crossref.org/documentation/retrieve-metadata/"
      attribution: "Not required for the facts. ScholarChain cites Crossref as the source. Documentation text itself is CC BY 4.0, but ScholarChain copies none of it."
      redistribution: "Bibliographic metadata and references: no restriction. Abstracts: publisher or author copyright, so ScholarChain does not ingest, store, or redistribute them."
    snapshot:
      version: "REST API, live (bounded lookups are stamped with retrieval time). The 2025 public data file is not used (HD-03-03)."
      date: "2026-10-18 (verification date of the API path; each response is stamped at fetch)"
      evidence_url: "https://www.crossref.org/documentation/retrieve-metadata/bulk-downloads/"
    format: "JSON (REST API message object, one work per line in the sample); bulk: tar of JSONL"
    size_estimate:
      text: "Bounded API subset only (HD-03-03): about 2 to 10 KB per work (unverified, from the sample shape); at most 500 works per run, so roughly 5 MB at most (unverified). The 2025 public data file (approximately 200 GB) is excluded."
      evidence_url: "https://www.crossref.org/documentation/retrieve-metadata/bulk-downloads/"
    s3_prefixes:
      subset: "s3://${raw_bucket}/raw/crossref/api/dblp_snapshot=2026-10-03/"
      sample: "s3://${sample_bucket}/samples/crossref/manifest_version=1/"
    checksums:
      upstream:
        - file: "api responses (one per DOI)"
          algorithm: none
          value: "to be recorded at download"
          evidence_url: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/"
          note: "fetch-by-id.sh writes a sha256 sidecar per response."
      samples:
        - path: "datasets/samples/crossref/crossref-works-sample.jsonl"
          sha256: "a52e792af2231c000e9ef3ed36ed5912d7a222dca53f801d5756f081d3d151b3"
          bytes: 4290
    subset_rule: >-
      DOIs extracted from the DBLP seed subset's ee fields, looked up one at a time with
      fetch-by-id.sh crossref (default 25, cap 500, 1 s between requests, polite-pool mailto from
      SCHOLARCHAIN_CROSSREF_MAILTO when set). The abstract field is dropped at ingestion. This
      bounded REST lookup by DOI is the only Crossref access path (HD-03-03, human decision,
      phase 03 human gate, 2026-10-18). No requester-pays or torrent bulk public data file.
    schema: "datasets/schemas/crossref.md"
    linkage_keys:
      - key: doi
        namespace: doi
        field: "DOI (lowercase)"
      - key: orcid
        namespace: orcid
        field: "author[].ORCID (URL form; strip resolver, validate check digit; used as carried, HD-03-01)"
      - key: reference_doi
        namespace: doi
        field: "reference[].DOI"
    update_method: "Bounded API re-lookup by DOI per run (responses kept per run prefix). The yearly public data file is not used (HD-03-03); using it would need a new human decision."
    limitations:
      - "API responses are live and change between runs. Pin by storing raw responses with sha256 and fetch time."
      - "No bulk file (HD-03-03), so coverage is limited to DOIs found in the DBLP seed subset, at most 500 per run."
      - "ORCID URL scheme (http versus https) in live data is unverified. Normalization must accept both."
    privacy_notes:
      - "Contains real names, ORCID iDs, and affiliation strings deposited by publishers."
      - "ORCID iDs are used only as Crossref carries them (author[].ORCID, authenticated-orcid). No ORCID registry or profile data is fetched to enrich them (HD-03-01, human decision, phase 03 human gate, 2026-10-18)."
      - "Affiliations, institution-level only at runtime (HD-03-02, human decision, phase 03 human gate, 2026-10-18): author[].affiliation[].name strings may be used in batch only, for example as entity-resolution features, and are dropped before Neptune, DynamoDB, S3 Vectors, and any runtime-facing export. No resolved institution ID field in Crossref affiliations was verified in phase 03, so no Crossref affiliation data reaches runtime."
      - "authenticated-orcid distinguishes ORCID-verified assertions. Unauthenticated ORCIDs are weaker evidence (policy: entity-resolution-engineer)."
      - "The polite-pool mailto is an operator contact address. It comes from the environment at run time and is never committed."
      - "The sample is fictional, except for the Josiah Carberry demonstration identity."
    decision_refs: [HD-03-01, HD-03-02, HD-03-03, HD-03-04]
    affiliation_handling:
      decision: HD-03-02
      batch_only_fields:
        - "author[].affiliation[].name"
      runtime_allowed_fields: []
      runtime_allowed_note: "Any resolved institution identifier inside Crossref affiliation objects is unverified; none is runtime-allowed until verified and approved."
      drop_before: [neptune, dynamodb, s3-vectors, runtime-export]
    confirmation_download:
      decision: HD-03-04
      status: approved-in-principle-not-run
      bound: "A few hundred DOIs through fetch-by-id.sh crossref (at most 500, the script's hard cap, 1 s between requests)."
      confirms:
        - "author[].ORCID URL scheme (http versus https)"
        - "author[].sequence and affiliation object shape"
        - "issued date-parts [[null]] quirk"
    validation_commands:
      - "bash datasets/scripts/validate-datasets.sh"
      - "bash datasets/scripts/fetch-by-id.sh crossref --ids dois.txt --dest \"$SCHOLARCHAIN_DATA_DIR\" --plan"
    samples:
