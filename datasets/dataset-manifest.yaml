        - url: "https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml"
          retrieved: "2026-10-18"
          fact: "Monthly snapshot releases. Latest is October 2026, DOI 10.4230/dblp.xml.2026-10-03. Collection license CC0 v1.0."
        - url: "https://dblp.org/xml/"
          retrieved: "2026-10-18"
          fact: "Rolling dblp.xml.gz (1.0G, 2026-10-18) with dblp.xml.gz.md5. dblp.dtd 13K. https://dblp.org/xml/release/ redirects to the Dagstuhl collection."
        - url: "https://dblp.org/xml/dblp.dtd"
          retrieved: "2026-10-18"
          fact: "DTD header states the CC0 1.0 license, DTD date May 10, 2023. Record elements, attributes, and 68 character entities."
        - url: "https://dblp.org/xml/docu/dblpxml.pdf"
          retrieved: "2026-10-18"
          fact: "ISO-8859-1 header but pure ASCII content with entities. Homonyms get a space plus a four-digit number. Person records are www homepages/ records."
    license:
      name: "CC0-1.0"
      url: "https://creativecommons.org/publicdomain/zero/1.0/legalcode"
      evidence_url: "https://dblp.org/xml/dblp.dtd"
      secondary_evidence_url: "https://dblp.org/xml/README.txt"
      attribution: "Not required. dblp asks for a link: 'we are always happy if you provide a link to us as the source of the data' (dblp.dtd header). ScholarChain cites dblp and the release DOI 10.4230/dblp.xml.2026-10-03."
      redistribution: "Permitted for any purpose, including commercial use, without permission (CC0 1.0). README.txt notes that ODC-BY 1.0 was a secondary license and asks users to move to CC0."
    snapshot:
      version: "dblp-2026-10-03 (monthly XML release)"
      date: "2026-10-03"
      doi: "10.4230/dblp.xml.2026-10-03"
      evidence_url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
      dtd_version: "May 10, 2023 (header of dblp.dtd)"
    format: "gzip-compressed XML, one <dblp> root, declared ISO-8859-1, ASCII bytes with DTD entities; DTD required for parsing"
    size_estimate:
      compressed_bytes_approx: 1030000000
      uncompressed_bytes: "unknown"
      records: "unknown"
      text: "1.03 GB compressed (publisher landing page). Uncompressed size and record count not stated by the publisher. Open question Q-dblp-size (kept open by HD-03-05)."
      evidence_url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
    s3_prefixes:
      raw: "s3://${raw_bucket}/raw/dblp/snapshot=2026-10-03/"
      sample: "s3://${sample_bucket}/samples/dblp/manifest_version=1/"
    checksums:
      upstream:
        - file: "dblp-2026-10-03.xml.gz"
          algorithm: md5
          value: "cbd329100ea1bbb2873fa2f6d414ea00"
          evidence_url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
        - file: "dblp.dtd"
          algorithm: sha256
          value: "2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6"
          evidence_url: "https://dblp.org/xml/dblp.dtd"
          note: "Computed by dataset-engineer over the bytes retrieved on 2026-10-18 (13134 bytes). dblp publishes no checksum for the DTD."
      samples:
        - path: "datasets/samples/dblp/dblp-sample.xml"
          sha256: "e8113ccc7e103fc9cb825cc79445722d67046660669e23676fa922fa535be76a"
          bytes: 4561
        - path: "datasets/samples/dblp/dblp-malformed.xml"
          sha256: "248e5866fa03e6eff42b613dfecdf5c02872e7ace69b5e3651505e8bfd64892a"
          bytes: 937
        - path: "datasets/samples/dblp/dblp.dtd"
          sha256: "2d864498f9eef9298662df11e3874171ff24cd4a21ab5974f1369c90acdb1ef6"
          bytes: 13134
    subset_rule: >-
      Seed subset for bounded runs: records whose key starts with one of the configured venue
      key prefixes (for example conf/kdd/ or journals/tkde/), with year inside the configured
      graph window. Plus every www homepages/ person record that names an author of a kept
      record. The prefixes and window are configuration, not constants. Extract with
      sample-extract.sh dblp-xml after a full, checksum-verified download. The full corpus is
      ingested only after a human approves the run.
    schema: "datasets/schemas/dblp.md"
    linkage_keys:
      - key: dblp_key
        namespace: dblp
        field: "record/@key"
      - key: doi
        namespace: doi
        field: "ee (https://doi.org/<doi>), lowercased"
      - key: arxiv_id
        namespace: arxiv
        field: "ee (https://arxiv.org/abs/<id>) on CoRR records"
      - key: orcid
        namespace: orcid
        field: "author/@orcid, editor/@orcid (used as carried by dblp, HD-03-01)"
      - key: dblp_person_id
        namespace: none
        namespace_note: "No core namespace, by design (settled by domain-engineer in phase 03; see Q-linkage-keys-without-core-namespace). Core's Researcher ID kind takes no namespace. A dblp person ID enters core as a source record ID (source_dataset dblp) and, when entity resolution picks it as the cluster anchor, through StableIds.scholarChainResearcherId(1, dblp, <person id>) = researcher:sc1:H(...). Choosing the anchor is entity-resolution policy."
        field: "www/@key without the homepages/ prefix"
    update_method: >-
      Monthly. A new dblp-YYYY-MM-DD release appears in the Dagstuhl collection
      (https://drops.dagstuhl.de/entities/collection/10.4230/dblp.xml). Add a new sources.tsv
      row with the published MD5 and a new snapshot= prefix. Never overwrite a previous
      snapshot prefix. The rolling daily dblp.xml.gz is not used for pipeline runs because its
      MD5 changes daily.
    limitations:
      - "No DOI element: DOIs come only from ee URLs, and many records have none."
      - "Homonym suffixes cover only the persons dblp has split. Unsuffixed names may still be several people."
      - "The JDK SAX parser has an entity-expansion limit that the full dump reaches (dblpxml.pdf)."
      - "Several dblp.org pages (FAQ, search API) were behind bot protection (Anubis) on 2026-10-18. fetch.sh may be blocked on dblp.org. The Dagstuhl release URLs were reachable."
      - "Samples are checksummed byte-exact. build-engineer's .gitattributes rule 'datasets/samples/** -text -eol' stops git from converting their line endings (Q-line-endings, closed). The rule protects checkouts only once .gitattributes is committed with or before the samples."
    privacy_notes:
      - "Contains names of real people, and ORCID iDs where dblp has them. Both are public bibliographic data under CC0."
      - "ORCID iDs are used only as dblp carries them (author/@orcid, editor/@orcid). No ORCID registry or profile data is fetched to enrich them (HD-03-01, human decision, phase 03 human gate, 2026-10-18)."
      - "Affiliations, institution-level only at runtime (HD-03-02, human decision, phase 03 human gate, 2026-10-18): raw affiliation strings in www person records (note type=\"affiliation\") may be used in batch only, for example as entity-resolution features, and are dropped before Neptune, DynamoDB, S3 Vectors, and any runtime-facing export. dblp carries no resolved institution IDs, so no dblp affiliation data reaches runtime."
      - "www person records can also carry homepage URLs. ScholarChain keeps only names, ORCID iDs, and person IDs needed for linkage."
      - "Committed samples are fictional and contain no personal data."
    decision_refs: [HD-03-01, HD-03-02, HD-03-04, HD-03-05, HD-03-06]
    affiliation_handling:
      decision: HD-03-02
      batch_only_fields:
        - "www/note[@type='affiliation'] (raw affiliation string)"
      runtime_allowed_fields: []
      runtime_allowed_note: "dblp has no resolved institution IDs. Nothing affiliation-related reaches runtime from dblp."
      drop_before: [neptune, dynamodb, s3-vectors, runtime-export]
    confirmation_download:
      decision: HD-03-04
      status: approved-in-principle-not-run
      approved_by: HD-03-06
      invoked_by: human
      max_bytes: 1200000000
      bound: >-
        1200000000 bytes (1.2 GB) for the single release file dblp-2026-10-03.xml.gz, the only
        full-tier dblp row in sources.tsv (estimate 1030000000). dblp publishes no smaller
        official artifact, so this confirmation download is the whole release. It is not a
        pipeline run: ingesting the full corpus on EMR still needs its own human approval.
      bound_justification: >-
        The publisher page states "1.03 GB" without saying whether GB is decimal or binary. The
        worst case is 1.035 GiB (1.03 rounded half-up, binary units) = 1111322788 bytes. A
        decimal reading gives less than 1035000000 bytes. 1200000000 covers the worst case with
        about 8 percent headroom. The release-md5 sidecar is a metadata-tier row (estimate 1024
        bytes) fetched by fetch.sh --metadata under that mode's own 10 MiB default bound, not by
        --full. Even counted together, both files stay under 1200000000. curl --max-filesize
        enforces the bound on the actual bytes, and fetch.sh verifies the published MD5
        cbd329100ea1bbb2873fa2f6d414ea00 before keeping the file.
      human_command: "bash datasets/scripts/fetch.sh dblp --full --max-bytes 1200000000 --dest \"$SCHOLARCHAIN_DATA_DIR\""
      human_only_note: >-
        Human-invoked only. docs/agents.md section 7b blocks fetch.sh --full for every agent
        (ratified in the phase 03 Round 2 human gate). This bound is the value the human passes
        as --max-bytes. fetch.sh has no hard byte ceiling for --full that would refuse it, and the
        default stays the no-network plan mode. The per-file curl time budget defaults to
        max(600 s, max-bytes at 1 MiB/s) = 1145 s for this bound. On a slower link, set
        SC_CURL_MAX_TIME.
      confirms:
        - "ee URL forms in the live dump (doi.org, arxiv.org/abs)"
        - "CoRR key pattern journals/corr/abs-YYMM-NNNNN and publtype=\"informal\""
        - "uncompressed size and record count"
    validation_commands:
      - "bash datasets/scripts/validate-datasets.sh"
      - "bash datasets/scripts/fetch.sh dblp --plan"
      - "bash datasets/scripts/fetch.sh dblp --metadata --dest \"$SCHOLARCHAIN_DATA_DIR\""
      - "md5sum -c dblp-2026-10-03.xml.gz.md5   # after an approved --full download"
    samples:
      - path: "datasets/samples/dblp/dblp-sample.xml"
        format: xml
        well_formed: true
        record_element: "*"
        records: 10
        malformed_records: 1
        provenance: "Synthetic, hand-authored by dataset-engineer on 2026-10-18 in the dblp XML wire format (ASCII with DTD entities)."
        license: "CC0-1.0 (ScholarChain-authored)"
        edge_cases:
          - "homonym names: Ada Sample, Ada Sample 0001, Ada Sample 0002, Ada Sample 0003"
          - "Unicode through symbolic entities (&uuml; &euml; &aacute; &ntilde; &oacute; &oslash;) and numeric references (&#321; &#7877; &#7883; &#7851;)"
          - "same work as conference and CoRR record (DOI 10.5555/sc441.0001, arXiv 2401.99901)"
          - "24-author article"
          - "missing year and ee"
          - "record without the REQUIRED key and with year 20x4 (well-formed, invalid against the DTD)"
          - "title markup (i, sub)"
          - "ORCID attribute on author"
          - "person records with alias names and a crossref-only alias record"
      - path: "datasets/samples/dblp/dblp-malformed.xml"
        format: xml
        well_formed: false
        record_element: "*"
        records: 3
        malformed_records: 2
        provenance: "Synthetic, hand-authored by dataset-engineer on 2026-10-18. Not well-formed by design."
        license: "CC0-1.0 (ScholarChain-authored)"
        edge_cases:
          - "undeclared entity &notdeclared;"
          - "truncated final record (simulated partial download)"
      - path: "datasets/samples/dblp/dblp.dtd"
        format: dtd
        records: 0
        malformed_records: 0
        provenance: "Verbatim copy of https://dblp.org/xml/dblp.dtd, retrieved 2026-10-18 (13134 bytes). Needed to parse the dblp samples."
        license: "CC0-1.0 (stated in the file header by dblp)"
        edge_cases: []

