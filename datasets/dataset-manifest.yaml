        pinned_release_md5: "https://drops.dagstuhl.de/storage/artifacts/dblp/xml/2026/dblp-2026-10-03.xml.gz.md5"
        dtd: "https://dblp.org/xml/dblp.dtd"
        rolling_daily: "https://dblp.org/xml/dblp.xml.gz"
      evidence:
        - url: "https://drops.dagstuhl.de/entities/artifact/10.4230/dblp.xml.2026-10-03"
