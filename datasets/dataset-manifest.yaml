      - key: openalex_work_id
        namespace: openalex
        field: "id"
      - key: openalex_author_id
        namespace: openalex
        namespace_note: "Settled by domain-engineer in phase 03 (Q-linkage-keys-without-core-namespace). The openalex namespace exists in core for work, venue, institution, and topic IDs, but core's Researcher ID kind takes no namespace. An OpenAlex author ID is a source record ID and entity-resolution evidence. When entity resolution picks it as the cluster anchor, it enters through StableIds.scholarChainResearcherId(1, openalex, <author id>) = researcher:sc1:H(...)."
        field: "authorships[].author.id (unverified subfield name)"
      - key: orcid
        namespace: orcid
        field: "authorships[].author.orcid (unverified subfield name; used as carried, HD-03-01)"
      - key: pmid
        namespace: pmid
        namespace_note: "IdNamespace.Pmid (wire name pmid) is present in modules/core, and IdKind.Work allows it (work:pmid:<n>, leading zeros stripped). Verified by dataset-engineer on 2026-10-18 in the phase 03 working tree, which the human has not yet committed."
        field: "ids.pmid"
      - key: openalex_institution_id
        namespace: openalex
        field: "authorships[].institutions[].id (unverified subfield name). Runtime-allowed with publication_year (HD-03-02)."
      - key: ror
        namespace: ror
        field: "authorships[].institutions[].ror (unverified subfield name). Runtime-allowed with publication_year (HD-03-02)."
    update_method: >-
      Quarterly public snapshot. Changed records land in new updated_date= partitions, and
      deletions are listed in deleted_ids.csv.gz, so an incremental update copies only partitions
      newer than the last recorded release and applies deletions. Each release gets a new
      release= prefix.
    limitations:
      - "No published checksums. Integrity rests on manifest content_length and record_count plus a sha256 recorded at download."
      - "Authorship subfield names (author.id, author.orcid, raw_author_name, institutions, author_position) are unverified this session. Confirm against one part file before parsing."
      - "Author IDs are OpenAlex's own disambiguation. They are evidence, not ground truth (match policy: entity-resolution-engineer)."
      - "The API now uses a free daily usage budget with an API key. Whether keyless requests are still served, and how to pass a key, is unverified. fetch-by-id.sh sends no key."
    privacy_notes:
      - "Contains real names, ORCID iDs, and institutional affiliations (raw_affiliation_strings). CC0 covers copyright, not privacy expectations."
      - "ORCID iDs are used only as OpenAlex carries them. No ORCID registry or profile data is fetched to enrich them (HD-03-01, human decision, phase 03 human gate, 2026-10-18)."
      - "Affiliations, institution-level only at runtime (HD-03-02, human decision, phase 03 human gate, 2026-10-18): only resolved institution links (authorships[].institutions[].id as an OpenAlex institution ID, or its ror) paired with the work's publication_year may reach runtime stores. raw_affiliation_strings and institution display names are batch only, for example as entity-resolution features, and are dropped before Neptune, DynamoDB, S3 Vectors, and any runtime-facing export."
      - "The sample is fictional."
    decision_refs: [HD-03-01, HD-03-02, HD-03-04, HD-03-05]
    affiliation_handling:
      decision: HD-03-02
      batch_only_fields:
        - "authorships[].raw_affiliation_strings"
        - "authorships[].institutions[].display_name"
      runtime_allowed_fields:
        - "authorships[].institutions[].id (OpenAlex institution ID) with publication_year"
        - "authorships[].institutions[].ror (ROR ID) with publication_year"
      runtime_allowed_note: "Subfield names are unverified until the HD-03-04 confirmation download."
      drop_before: [neptune, dynamodb, s3-vectors, runtime-export]
    confirmation_download:
      decision: HD-03-04
      status: approved-in-principle-not-run
      bound: >-
        A few hundred works through fetch-by-id.sh openalex (at most 500 DOIs, the script's hard
        cap). A works part file is not used for confirmation: a part holds up to 400,000 records
        and its byte size is unknown until the bucket manifest is listed.
      confirms:
        - "authorships subfields: author.id, author.orcid, raw_author_name, institutions[].id, institutions[].ror, author_position, raw_affiliation_strings"
        - "whether keyless API requests are served"
    validation_commands:
      - "bash datasets/scripts/validate-datasets.sh"
      - "bash datasets/scripts/fetch.sh openalex --plan"
      - "bash datasets/scripts/fetch-by-id.sh openalex --ids dois.txt --dest \"$SCHOLARCHAIN_DATA_DIR\" --plan"
    samples:
      - path: "datasets/samples/openalex/openalex-works-sample.jsonl"
        format: jsonl
        records: 4
        malformed_records: 1
        provenance: "Synthetic, hand-authored by dataset-engineer on 2026-10-18 in the OpenAlex work object shape."
        license: "CC0-1.0 (ScholarChain-authored)"
        edge_cases:
          - "uppercase DOI variant of 10.5555/sc441.0001"
          - "raw_author_name in Unicode NFD versus NFC display_name"
          - "ASCII-folded raw name"
          - "doi, title, display_name null; empty authorships"
          - "HTML markup in the title"
          - "truncated JSON line"

