raw_collection:
  redaction: >-
    Each sbt run's stdout and stderr was captured verbatim to a scratchpad file outside the
    repository, then copied into raw/ with one sed pass that replaces the local user-profile path
    prefix with <USERPROFILE>, the local host name with <HOST>, and the local user name with
    <USER>. No other byte is changed (line counts equal). The literal values are not recorded
    anywhere in the repository. ANSI color codes from sbt are kept.
  immutability: >-
    raw/ files are written once and never edited. Exception, disclosed: raw/01 and raw/02 were
    regenerated twice from the same verbatim scratchpad capture while the redaction rule was being
    completed (the first pass missed backslash paths, the second missed the host and user names in
    Spark log lines), before any result was read from them. The checksums below are final.
  compression: >-
    raw/02-spark-test.log (11,579,704 bytes, mostly Spark INFO lines) is too large for Git, so it is
    stored only as raw/02-spark-test.log.gz (747,420 bytes), made after collection with
    "gzip -9 -n -c raw/02-spark-test.log > raw/02-spark-test.log.gz" (GNU gzip 1.13; -n omits the
    name and timestamp, so the output is reproducible: two runs gave the same sha256). Compression
    only; no byte of the log content changed. Verify with
    "gunzip -c raw/02-spark-test.log.gz | sha256sum", which must print the uncompressed sha256 below.
    The other raw files are stored uncompressed.
  git_ignore: >-
    raw/01-er-test.log and raw/03-contract-graph-er.log match the repository ignore rule
    ".gitignore:14: *.log" (confirmed with git check-ignore -v). A plain
    "git add experiments/phase-16" therefore leaves them out, and the checksums and links to them
    in this manifest and results.md would point at files that are not in the repository. The other
    raw files (00-start-utc.txt, 02-spark-test.log.gz, 99-end-utc.txt) are not ignored.
    .gitignore is owned by build-engineer and is not changed here. MANUAL ACTION REQUIRED: when the
    human archives this experiment, run from the repository root
    "git add -f experiments/phase-16/offline/raw/01-er-test.log experiments/phase-16/offline/raw/03-contract-graph-er.log"
    in addition to "git add experiments/phase-16", then confirm both appear in "git status".
  collection_window_utc: {start: 2026-11-25T01:39:02Z, end: 2026-11-25T01:54:07Z}
  raw_sha256:
    raw/00-start-utc.txt: 43a001be96fe0f2dc069d64cf62358d1ae713ee1a561744ea6adf0a107e78491
    # 01 and 03 are git-ignored (*.log); archive them with git add -f (raw_collection.git_ignore).
    raw/01-er-test.log: 25768bbc7683746b6241ab0ec45056a70c72ca06f58e36f6ad5636ac976b4f90
    raw/02-spark-test.log (uncompressed content, not stored): d237121035745d8ca00e407830d0639de0a71bacdf11f568eb5d65871b5884f0
    raw/02-spark-test.log.gz (stored file): 9e039fefaa2aad2c3b7dd47d24eddf355b8ac1c019f34e01b7e37f71047814a4
    raw/03-contract-graph-er.log: a88b84ce35c30b4ea84e5ca2beb45b51733ce3d8b303a0c60e0bea2e03bafa5b
    raw/99-end-utc.txt: 3d4649f302169ab5ebd3cbe792b45f31a8eb657d761188b280a3b3df0396d431

